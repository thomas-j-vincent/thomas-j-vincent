name: Update contribution graph

on:
  schedule:
    - cron: "0 4 * * *"   # once a day, 04:00 UTC
  workflow_dispatch: {}    # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate graph
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GRAPH_TOKEN }}
        run: node scripts/generate-graph.js

      - name: Generate banner
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GRAPH_TOKEN }}
        run: node scripts/generate-banner.js

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update contribution graph"
          file_pattern: "dist/contribution-graph.svg dist/contribution-banner.svg"